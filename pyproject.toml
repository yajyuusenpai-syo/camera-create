[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "camera-create"
version = "0.1.0"
description = "Metric camera calibration from video using Pi3X, MoGe-2, and NVIDIA VIPE"
requires-python = ">=3.10,<3.15"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "opencv-python-headless>=4.8",
  "torch>=2.4",
  "torchvision>=0.19",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
camera-create = "camera_create.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
extend-exclude = [".conda-env", ".conda-pkgs", "ckpt", "outputs"]
